<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A crowdsourced catalog of Seattle's worst bike parking. Browse, search, and submit bad racks across the city." />
  <title>Bad Racks Seattle</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <nav class="site-nav" aria-label="Main navigation">
      <div class="site-title-group">
        <h1 class="site-title">Bad&nbsp;<span>Racks</span>&nbsp;Seattle</h1>
        <p class="site-subtitle">Crowdsourced catalog of Seattle's worst bike parking</p>
      </div>
      <a href="submit.html" class="btn-submit-nav" aria-label="Submit a bad rack">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Submit a Rack
      </a>
    </nav>
  </header>

  <div class="search-section">
    <div class="search-inner">
      <label class="search-label" for="search-input">Search racks</label>
      <div class="search-wrapper">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input
          id="search-input"
          type="search"
          placeholder="Search by neighborhood, type, or nickname..."
          autocomplete="off"
          spellcheck="false"
        />
      </div>
    </div>
  </div>

  <main class="main-content">
    <p class="rack-count" id="rack-count">Loading racks&hellip;</p>
    <div id="rack-grid" class="rack-grid" role="list" aria-label="Bad bike racks in Seattle"></div>
  </main>

  <footer class="site-footer">
    <p><strong>Bad Racks Seattle</strong></p>
    <p>A community project to document and improve bike parking across the city.</p>
    <p>Know a bad rack? <a href="submit.html">Submit it here.</a></p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
